name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Read-only token: jobs build and run code from another repository (the testbed).
permissions:
  contents: read

# Bash on every runner, Windows included (Git Bash), so the steps are the same everywhere.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and format (ESLint, Prettier, dotnet format)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier and dotnet format
        run: npm run format:check

  build:
    name: Build and Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Typecheck scripts
        run: npm run typecheck:scripts
      - name: Test (without the compiler tests, which run in the compiler-tests jobs)
        env:
          CODE_JANITOR_TEST_CATEGORY: unit
        run: npm test
      - name: Bundle (the C# engine server and the extension)
        run: npm run build
      - name: Verify bundle
        run: npm run verify:bundle
      - name: Verify packaged VSIX contents
        run: |
          npx vsce ls > vsix-files.txt
          grep -q '^dist/server/CodeJanitor.Server.dll$' vsix-files.txt
          grep -q '^dist/extension.js$' vsix-files.txt
          ! grep -E '^(src|server|test|scripts|shared)/' vsix-files.txt

  e2e:
    name: Extension tests in VS Code (e2e, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      # Linux runners have no display: the VS Code host runs under a virtual one.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the e2e tests under xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Run the e2e tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

  server:
    name: C# engine server (build and test, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The engine tests run the testbed scenarios: the testbed's develop branch, as in the testbed job.
      - uses: actions/checkout@v7
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build server/CodeJanitor.Server.slnx
      - name: Test
        env:
          CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
        run: dotnet test server/CodeJanitor.Server.slnx

  compiler-test-categories:
    name: List compiler test categories
    needs: lint
    runs-on: ubuntu-26.04
    outputs:
      categories: ${{ steps.list.outputs.categories }}
    steps:
      - uses: actions/checkout@v7
      # The testbed category runs in its own job, which also clones the testbed.
      - id: list
        run: echo "categories=$(jq -c 'keys - ["testbed"]' test/compilerTests.json)" >> "$GITHUB_OUTPUT"

  compiler-tests:
    name: Compiler tests (${{ matrix.category }}, ${{ matrix.os }})
    needs: compiler-test-categories
    # Public repository: GitHub-hosted runners only. One runner per category and system, so the builds of one never slow another down.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.compiler-test-categories.outputs.categories) }}
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Build cleaned C# with the real compiler
        env:
          CODE_JANITOR_TEST_CATEGORY: ${{ matrix.category }}
          CODE_JANITOR_REQUIRE_DOTNET: '1'
        run: npm test

  compile-oracle:
    name: Compile oracle (cleaned C# still builds, ${{ matrix.os }})
    needs: lint
    # Public repository: GitHub-hosted runners only. The run takes about a minute; the limit is a safety net
    # against a hung dotnet build or a long blame loop after a failure.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Build test/oracle before and after cleanup
        run: npm run verify:compile

  testbed:
    name: Testbed (every cleanup option on bad C#, built and run, ${{ matrix.os }})
    needs: lint
    # Public repository: GitHub-hosted runners only. The whole job takes a few minutes; the limit is a safety net.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      # No token is left in .git/config: the testbed's MSBuild targets and program run in this job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The testbed's develop branch: the testbed and this repository are not versioned separately.
      - uses: actions/checkout@v7
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Run every scenario through the C# engine server, then build and run the cleaned solution
        env:
          CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
          CODE_JANITOR_REQUIRE_TESTBED: '1'
          CODE_JANITOR_REQUIRE_DOTNET: '1'
        run: npm run test:testbed
