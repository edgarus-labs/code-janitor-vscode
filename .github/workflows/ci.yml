name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: jobs build and run code from another repository (the testbed).
permissions:
  contents: read

# Bash on every runner, Windows included (Git Bash), so the steps are the same everywhere.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and format (ESLint, Prettier, dotnet format)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - name: ESLint
        run: npm run lint
      - name: Prettier and dotnet format
        run: npm run format:check

  build:
    name: Build and Test
    needs: [lint, server]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - name: Typecheck
        run: npm run compile
      - name: Typecheck scripts
        run: npm run typecheck:scripts
      - name: Test (without the compiler tests, which run in the compiler-tests jobs)
        env:
          CODE_JANITOR_TEST_CATEGORY: unit
        run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: dist/server
      - name: Bundle the extension
        run: node esbuild.js --production
      - name: Verify bundle
        run: npm run verify:bundle
      - name: Verify packaged VSIX contents
        run: |
          npx vsce ls > vsix-files.txt
          grep -q '^dist/server/CodeJanitor.Server.dll$' vsix-files.txt
          grep -q '^dist/extension.js$' vsix-files.txt
          ! grep -E '^(src|server|test|scripts|shared)/' vsix-files.txt
          ! grep -E '^\.' vsix-files.txt

  e2e:
    name: Extension tests in VS Code (e2e)
    needs: [lint, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: dist/server
      - name: Bundle the extension
        run: node esbuild.js --production
      - name: Compile the e2e tests
        run: npx tsc -p tsconfig.e2e.json
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the e2e tests under xvfb
        run: xvfb-run -a npx vscode-test

  server:
    name: C# engine server (build, artifact and xunit tests)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release server/CodeJanitor.Server.slnx
      - name: Publish the server
        run: dotnet publish server/src/CodeJanitor.Server/CodeJanitor.Server.csproj -c Release --no-build -o dist/server --nologo -v quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/server
          retention-days: 1
          if-no-files-found: error
      - name: Test
        env:
          CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
        run: dotnet test -c Release server/CodeJanitor.Server.slnx --no-build

  compiler-test-categories:
    name: List compiler test categories
    needs: [lint, build]
    runs-on: ubuntu-26.04
    outputs:
      categories: ${{ steps.list.outputs.categories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The testbed category runs in its own job, which also clones the testbed.
      - id: list
        run: echo "categories=$(jq -c 'keys - ["testbed"]' test/compilerTests.json)" >> "$GITHUB_OUTPUT"

  compiler-tests:
    name: Compiler tests (${{ matrix.category }})
    needs: compiler-test-categories
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CODE_JANITOR_SERVER_DLL: ${{ github.workspace }}/dist/server/CodeJanitor.Server.dll
    strategy:
      fail-fast: true
      matrix:
        category: ${{ fromJSON(needs.compiler-test-categories.outputs.categories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: dist/server
      - name: Build cleaned C# with the real compiler
        env:
          CODE_JANITOR_TEST_CATEGORY: ${{ matrix.category }}
          CODE_JANITOR_REQUIRE_DOTNET: '1'
        run: npm test

  compile-oracle:
    name: Compile oracle (cleaned C# still builds)
    needs: [lint, build]
    # Public repository: GitHub-hosted runners only. The run takes about a minute; the limit is a safety net
    # against a hung dotnet build or a long blame loop after a failure.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CODE_JANITOR_SERVER_DLL: ${{ github.workspace }}/dist/server/CodeJanitor.Server.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: dist/server
      - name: Build test/oracle before and after cleanup
        run: npm run verify:compile

  testbed:
    name: Testbed (every cleanup option on bad C#, built and run)
    needs: [lint, build]
    # Public repository: GitHub-hosted runners only. The whole job takes a few minutes; the limit is a safety net.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CODE_JANITOR_SERVER_DLL: ${{ github.workspace }}/dist/server/CodeJanitor.Server.dll
    steps:
      # No token is left in .git/config: the testbed's MSBuild targets and program run in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The testbed's develop branch: the testbed and this repository are not versioned separately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: dist/server
      - name: Run every scenario through the C# engine server, then build and run the cleaned solution
        env:
          CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
          CODE_JANITOR_REQUIRE_TESTBED: '1'
          CODE_JANITOR_REQUIRE_DOTNET: '1'
        run: npm run test:testbed
