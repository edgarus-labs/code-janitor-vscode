name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
      CODE_JANITOR_REQUIRE_TESTBED: '1'
      CODE_JANITOR_REQUIRE_DOTNET: '1'
      CODE_JANITOR_SERVER_DLL: ${{ github.workspace }}/dist/server/CodeJanitor.Server.dll
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Build the server
        run: dotnet build -c Release server/CodeJanitor.Server.slnx
      - name: Server tests
        run: dotnet test -c Release server/CodeJanitor.Server.slnx --no-build
      - name: Publish the server
        run: dotnet publish server/src/CodeJanitor.Server/CodeJanitor.Server.csproj -c Release --no-build -o dist/server --nologo -v quiet
      - name: Test
        run: npm test
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Package the extension (.vsix)
        run: npx vsce package
      - name: Verify bundle
        run: npm run verify:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: '*.vsix'
          draft: true
          generate_release_notes: true
