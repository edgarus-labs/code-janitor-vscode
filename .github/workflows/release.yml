name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  package:
    name: Test and package
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CODE_JANITOR_TESTBED: ${{ github.workspace }}/.testbed
      CODE_JANITOR_REQUIRE_TESTBED: '1'
      CODE_JANITOR_REQUIRE_DOTNET: '1'
      CODE_JANITOR_SERVER_DLL: ${{ github.workspace }}/dist/server/CodeJanitor.Server.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgarus-labs/code-janitor-testbed
          ref: develop
          path: .testbed
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Check Node.js
        run: npm run check:node
      - name: Typecheck
        run: npm run compile
      - name: Build the server
        run: dotnet build -c Release server/CodeJanitor.Server.slnx
      - name: Server tests
        run: dotnet test -c Release server/CodeJanitor.Server.slnx --no-build
      - name: Publish the server
        run: dotnet publish server/src/CodeJanitor.Server/CodeJanitor.Server.csproj -c Release --no-build -o dist/server --nologo -v quiet
      - name: Test
        run: npm test
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Package the extension (.vsix)
        run: npx vite-node scripts/package-vsix.ts
      - name: Verify the release version (tag, package.json, VSIX manifest, file name)
        id: vsix
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          shopt -s nullglob
          vsix=(*.vsix)
          npm run check:release -- "${args[@]}" "${vsix[@]}"
          echo "file=${vsix[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify packaged VSIX contents
        run: |
          npx vsce ls > vsix-files.txt
          grep -q '^dist/server/CodeJanitor.Server.dll$' vsix-files.txt
          grep -q '^dist/extension.js$' vsix-files.txt
          ! grep -E '^(src|server|test|scripts|shared)/' vsix-files.txt
          ! grep -E '^\.' vsix-files.txt
      - name: Verify bundle
        run: npm run verify:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.vsix.outputs.file }}
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error
    outputs:
      vsix: ${{ steps.vsix.outputs.file }}

  release:
    name: Create the GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.vsix }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: ${{ needs.package.outputs.vsix }}
          draft: true
          generate_release_notes: true
