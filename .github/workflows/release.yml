name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Test
        run: npm test
      - name: Verify bundle
        run: npm run build && npm run verify:bundle

  package:
    name: Package (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-2025, target: win32-x64, rid: win-x64 }
          - { os: windows-2025, target: win32-arm64, rid: win-arm64 }
          - { os: ubuntu-26.04, target: linux-x64, rid: linux-x64 }
          - { os: ubuntu-26.04, target: linux-arm64, rid: linux-arm64 }
          - { os: macos-15, target: darwin-x64, rid: osx-x64 }
          - { os: macos-15, target: darwin-arm64, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      # The server is published for the target's runtime identifier (framework-dependent): only that platform's native
      # assets and launcher go into the VSIX. MSBuild reads the two properties from the environment.
      - name: Package the extension (.vsix)
        env:
          RuntimeIdentifier: ${{ matrix.rid }}
          SelfContained: 'false'
        run: npx vsce package --target ${{ matrix.target }}
      - name: Verify bundle
        run: npm run verify:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: '*.vsix'
          draft: true
          generate_release_notes: true
